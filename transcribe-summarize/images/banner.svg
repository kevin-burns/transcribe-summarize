  <text x="1330" y="556" font-family="Menlo, DejaVu Sans Mono, monospace" font-size="92" font-weight="700">
    <tspan fill="#4D94C9">transcribe</tspan><tspan fill="#FFFFFF">-summarize</tspan>
  </text>
  <text x="1336" y="632" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="33" fill="#85898F">on-device by default &#183; mac, windows, linux &#183; the network is opt-in</text>

  <text x="1336" y="800" xml:space="preserve" font-family="Menlo, DejaVu Sans Mono, monospace" font-size="46"><tspan fill="#71BD86">$ transcribe.py</tspan><tspan fill="#D4D8DD"> standup.m4a</tspan></text>

